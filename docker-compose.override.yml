# Homelab overrides (committed on the homelab branch — no secret values here;
# secrets live in the gitignored .env).
services:
  worldmonitor:
    ports: !override
      - "127.0.0.1:3002:8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - main
    labels:
      - traefik.enable=true
      - traefik.docker.network=main
      - traefik.http.routers.worldmonitor.rule=Host(`worldmonitor.hippiekiller.net`)
      - traefik.http.routers.worldmonitor.entrypoints=websecure
      - traefik.http.routers.worldmonitor.tls=true
      - traefik.http.routers.worldmonitor.tls.certresolver=cloudflare
      - traefik.http.routers.worldmonitor.middlewares=ip-allowlist@file,rate-limit@file,security-headers@file
      - traefik.http.routers.worldmonitor.service=worldmonitor
      - traefik.http.services.worldmonitor.loadbalancer.server.port=8080
    environment:
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?set in .env}"
      # Not in upstream's compose env list but read by the in-app webcam route
      # (server/worldmonitor/webcam/v1/get-webcam-image.ts). Value in .env.
      WINDY_API_KEY: "${WINDY_API_KEY:-}"
    # Upstream healthcheck is broken for self-hosting: `localhost` resolves to
    # ::1 (nginx is IPv4-only) and /api/health 401s without an operator API
    # key. Probe the SPA root over IPv4 instead.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
    # Drop the ais-relay dependency — the relay is profile-gated below until an
    # AISSTREAM_API_KEY exists (it refuses to run without one).
    depends_on: !override
      redis-rest:
        condition: service_started

  ais-relay:
    # Requires AISSTREAM_API_KEY (free key: https://aisstream.io). Profile-gated
    # so it isn't created at all until the key lands in .env; vessel tracking is
    # off until then. Enable with: docker compose --profile ais up -d
    profiles: ["ais"]
    security_opt:
      - no-new-privileges:true
    environment:
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?set in .env}"

  redis:
    security_opt:
      - no-new-privileges:true

  redis-rest:
    security_opt:
      - no-new-privileges:true

networks:
  main:
    external: true
