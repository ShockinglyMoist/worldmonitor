# Homelab overrides (committed on the homelab branch — no secret values here;
# secrets live in the gitignored .env).
services:
  worldmonitor:
    build:
      args:
        # Bakes the operator license key into the client bundle at build.
        # Value from .env (gitignored) — never committed.
        WM_LICENSE_KEY: "${WM_LICENSE_KEY:-}"
    ports: !override
      - "127.0.0.1:3002:8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - main
    labels:
      - traefik.enable=true
      - traefik.docker.network=main
      - traefik.http.routers.worldmonitor.rule=Host(`worldmonitor.hippiekiller.net`)
      - traefik.http.routers.worldmonitor.entrypoints=websecure
      - traefik.http.routers.worldmonitor.tls=true
      - traefik.http.routers.worldmonitor.tls.certresolver=cloudflare
      - traefik.http.routers.worldmonitor.middlewares=ip-allowlist@file,rate-limit@file,security-headers@file
      - traefik.http.routers.worldmonitor.service=worldmonitor
      # TEMPORARY public showcase route (Stan, 2026-07-08): no ip-allowlist by
      # design — short-lived demo, NOT behind Authentik. Tear down by removing
      # these wm labels + the proxied Cloudflare A record `wm`.
      - traefik.http.routers.worldmonitor-public.rule=Host(`wm.hippiekiller.net`)
      - traefik.http.routers.worldmonitor-public.entrypoints=websecure
      - traefik.http.routers.worldmonitor-public.tls=true
      - traefik.http.routers.worldmonitor-public.tls.certresolver=cloudflare
      - traefik.http.routers.worldmonitor-public.middlewares=rate-limit@file,security-headers@file
      - traefik.http.routers.worldmonitor-public.service=worldmonitor
      - traefik.http.services.worldmonitor.loadbalancer.server.port=8080
    environment:
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?set in .env}"
      # Not in upstream's compose env list but read by the in-app webcam route
      # (server/worldmonitor/webcam/v1/get-webcam-image.ts). Value in .env.
      WINDY_API_KEY: "${WINDY_API_KEY:-}"
      # Also missing from upstream's compose env list: /api/wm-session fails
      # closed (503) without it, which 401s every session-authed API route —
      # the whole dashboard reads as dead. Min 32 chars.
      WM_SESSION_SECRET: "${WM_SESSION_SECRET:?set in .env}"
      # Operator/enterprise key allowlist — the baked-in license key (above)
      # is matched against this server-side to bypass the entitlement gate on
      # tier-gated routes (api/_api-key.js isValidEnterpriseKey).
      WORLDMONITOR_VALID_KEYS: "${WORLDMONITOR_VALID_KEYS:-}"
      # Shared secret for seed-resilience-scores.mjs ?refresh=1 requests — the
      # server timingSafeEquals this against the seeder's X-WorldMonitor-Key
      # (server/gateway.ts isResilienceRankingSeedRefreshRequest). Self-minted;
      # value in .env. Without it the resilience ranking never populates.
      WORLDMONITOR_SEED_REFRESH_KEY: "${WORLDMONITOR_SEED_REFRESH_KEY:-}"
    # Upstream healthcheck is broken for self-hosting: `localhost` resolves to
    # ::1 (nginx is IPv4-only) and /api/health 401s without an operator API
    # key. Probe the SPA root over IPv4 instead.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
    # Drop the ais-relay dependency — the relay is profile-gated below until an
    # AISSTREAM_API_KEY exists (it refuses to run without one).
    depends_on: !override
      redis-rest:
        condition: service_started

  ais-relay:
    # Requires AISSTREAM_API_KEY (free key: https://aisstream.io). Profile-gated
    # so it isn't created at all until the key lands in .env; vessel tracking is
    # off until then. Enable with: docker compose --profile ais up -d
    profiles: ["ais"]
    security_opt:
      - no-new-privileges:true
    environment:
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?set in .env}"
      # OpenSky OAuth — anonymous access is rate-limited into uselessness
      # (502s); scripts/ais-relay.cjs uses these for the ADS-B feed.
      OPENSKY_CLIENT_ID: "${OPENSKY_CLIENT_ID:-}"
      OPENSKY_CLIENT_SECRET: "${OPENSKY_CLIENT_SECRET:-}"

  redis:
    security_opt:
      - no-new-privileges:true

  redis-rest:
    security_opt:
      - no-new-privileges:true

networks:
  main:
    external: true
